<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui;background:radial-gradient(circle at 50% 15%,#28356b,#080a14 55%,#020307);color:white}.wrap{width:min(900px,92%);text-align:center}.tag{display:inline-block;padding:7px 12px;border:1px solid #46527b;border-radius:999px;color:#7fe6ff;background:#10172d}h1{font-size:clamp(42px,9vw,88px);margin:20px 0 6px;letter-spacing:-4px}.sub{color:#aeb8d2;margin:0 0 28px}.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.box{padding:25px 10px;border:1px solid #303b60;background:#0d1325dd;border-radius:18px}.num{font-size:clamp(42px,8vw,76px);font-weight:800}.label{color:#8995b3;font-size:12px;text-transform:uppercase;letter-spacing:2px}.panel{margin-top:20px;padding:18px;border:1px solid #303b60;background:#0d1325dd;border-radius:18px}input{padding:12px;border-radius:10px;border:1px solid #3a4669;background:#080c18;color:white;font-size:16px}button{padding:12px 18px;border:0;border-radius:10px;background:#65ddff;color:#06101a;font-weight:800;cursor:pointer;margin:6px}.presets{margin-top:10px}.presets button{background:#19223b;color:#dce5ff}.done{color:#65ddff;font-weight:800}@media(max-width:600px){.clock{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><span class="tag">LIVE COUNTDOWN</span><h1>Countdown</h1><p class="sub" id="target">Choose a date or a quick timer.</p><section class="clock"><div class="box"><div class="num" id="d">00</div><div class="label">Days</div></div><div class="box"><div class="num" id="h">00</div><div class="label">Hours</div></div><div class="box"><div class="num" id="m">00</div><div class="label">Minutes</div></div><div class="box"><div class="num" id="s">00</div><div class="label">Seconds</div></div></section><section class="panel"><input id="date" type="datetime-local"><button onclick="startDate()">Start countdown</button><div class="presets"><button onclick="start(1)">1 minute</button><button onclick="start(10)">10 minutes</button><button onclick="start(60)">1 hour</button><button onclick="start(1440)">1 day</button></div></section></main><script>let target=Date.now()+60000,timer;const $=x=>document.getElementById(x);function start(min){target=Date.now()+min*60000;run()}function startDate(){if($('date').value){target=new Date($('date').value).getTime();run()}}function run(){clearInterval(timer);tick();timer=setInterval(tick,250)}function tick(){let ms=Math.max(0,target-Date.now()),x=Math.floor(ms/1000);let d=Math.floor(x/86400);x%=86400;let h=Math.floor(x/3600);x%=3600;let m=Math.floor(x/60);let s=x%60;$('d').textContent=String(d).padStart(2,'0');$('h').textContent=String(h).padStart(2,'0');$('m').textContent=String(m).padStart(2,'0');$('s').textContent=String(s).padStart(2,'0');$('target').innerHTML=ms?'Ends '+new Date(target).toLocaleString():'<span class="done">TIME IS UP!</span>';if(!ms)clearInterval(timer)}run();</script></body></html>
