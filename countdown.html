<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 15%,#24305d,#090b16 55%,#030409)}.wrap{width:min(900px,92%);text-align:center}.tag{display:inline-block;padding:7px 12px;border:1px solid #39466f;border-radius:999px;color:#8de8ff;background:#0e1427}h1{font-size:clamp(42px,9vw,88px);margin:20px 0 5px;letter-spacing:-4px}.sub{color:#aeb8d2;margin:0 0 28px}.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.box{padding:25px 10px;border:1px solid #303b60;background:#0d1325cc;border-radius:18px;box-shadow:0 15px 50px #0005}.num{font-size:clamp(42px,8vw,76px);font-weight:800}.label{color:#8995b3;font-size:12px;text-transform:uppercase;letter-spacing:2px}.panel{margin-top:20px;padding:18px;border:1px solid #303b60;background:#0d1325cc;border-radius:18px}input{padding:12px;border-radius:10px;border:1px solid #3a4669;background:#080c18;color:white;font-size:16px;width:120px}button{padding:12px 18px;border:0;border-radius:10px;background:#65ddff;color:#06101a;font-weight:800;cursor:pointer;margin:5px}.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.presets button{background:#19223b;color:#dce5ff}.done{color:#65ddff;font-weight:800}.custom{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;align-items:center;margin-bottom:8px}.custom label{color:#aeb8d2;font-size:14px}@media(max-width:600px){.clock{grid-template-columns:repeat(2,1fr)}input{width:90px}}</style></head><body><main class="wrap"><span class="tag">LIVE COUNTDOWN</span><h1>Countdown</h1><p class="sub" id="targetText">Choose how long you want to wait.</p><section class="clock"><div class="box"><div class="num" id="days">00</div><div class="label">Days</div></div><div class="box"><div class="num" id="hours">00</div><div class="label">Hours</div></div><div class="box"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div><div class="box"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div></section><section class="panel"><div class="custom"><label>Wait:</label><input id="d" type="number" min="0" value="0" placeholder="Days"><span>days</span><input id="h" type="number" min="0" value="0" placeholder="Hours"><span>hours</span><input id="m" type="number" min="0" value="5" placeholder="Minutes"><span>min</span><input id="s" type="number" min="0" value="0" placeholder="Seconds"><span>sec</span><button id="start">START</button></div><div class="presets"><button data-min="1">1 minute</button><button data-min="10">10 minutes</button><button data-min="60">1 hour</button><button data-min="480">8 hours</button><button data-min="1440">1 day</button></div></section></main><script>const $=id=>document.getElementById(id);let target=Date.now()+300000,timer;function setTarget(t){target=t;$('targetText').textContent='Countdown is running...';clearInterval(timer);tick();timer=setInterval(tick,250)}function tick(){let ms=Math.max(0,target-Date.now()),s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;$('days').textContent=String(d).padStart(2,'0');$('hours').textContent=String(h).padStart(2,'0');$('minutes').textContent=String(m).padStart(2,'0');$('seconds').textContent=String(s).padStart(2,'0');if(ms<=0){$('targetText').innerHTML='<span class="done">TIME IS UP!</span>';clearInterval(timer)}}$('start').onclick=()=>{let d=Math.max(0,+$('d').value||0),h=Math.max(0,+$('h').value||0),m=Math.max(0,+$('m').value||0),s=Math.max(0,+$('s').value||0);setTarget(Date.now()+(((d*24+h)*60+m)*60+s)*1000)};document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>setTarget(Date.now()+Number(b.dataset.min)*60000));setTarget(target);</script></body></html>
